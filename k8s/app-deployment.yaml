apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-app
  template:
    metadata:
      labels:
        app: chatbot-app
    spec:
      containers:
        - name: chatbot-app
          image: chatbot-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: LLM_PROVIDER
              value: gemini
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatbot-app-secret
                  key: database_url
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chatbot-app-secret
                  key: llm_api_key
            - name: LLM_MODEL
              value: gemini-2.5-flash
            - name: LLM_BASE_URL
              value: https://generativelanguage.googleapis.com/v1beta/openai/
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
