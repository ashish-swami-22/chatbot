<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Application</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="backdrop backdrop-one"></div>
    <div class="backdrop backdrop-two"></div>

    <main class="shell">
      <aside class="sidebar">
        <section class="card intro-card">
          <div class="list-header">
            <div>
              <div class="section-title">Dashboard</div>
              <div class="section-subtitle">View chat metrics</div>
            </div>
            <a class="dashboard-button" href="/dashboard">Dashboard</a>
          </div>

          <div class="list-header history-header">
            <div>
              <div class="section-title">Conversations</div>
              <div class="section-subtitle">Resume any saved thread</div>
            </div>
            <button id="newConversationButton" class="ghost-button" type="button">
              New chat
            </button>
          </div>

          <div id="conversationList" class="conversation-list" aria-label="Conversation list"></div>
        </section>
      </aside>

      <section class="chat-card card">
        <header class="chat-header">
          <div>
            <div id="activeConversationTitle" class="chat-title">Conversation</div>
            <div id="activeConversationSubtitle" class="chat-subtitle">
              Select a thread or start a new one.
            </div>
          </div>
          <div class="header-actions">
            <button id="cancelButton" class="ghost-button" type="button">Cancel conversation</button>
            <button id="resetButton" class="ghost-button" type="button">Clear thread</button>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite" aria-label="Chat messages"></div>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Ask something, then keep the conversation going..."
          ></textarea>
          <button id="sendButton" class="send-button" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
